<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0077ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040814" stop-opacity="0"/>
    </radialGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Disc -->
  <rect width="300" height="300" rx="36" fill="#040814"/>
  <circle cx="150" cy="150" r="130" fill="url(#reactorGlow)" opacity="0.25"/>

  <!-- Outer HUD Ring -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="150" cy="150" r="110" fill="none" stroke="#0077ff" stroke-width="2" opacity="0.6"/>

  <!-- Segmented Stator Housing -->
  <circle cx="150" cy="150" r="92" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="32 25" filter="url(#coreGlow)"/>

  <!-- Stator Spoke Plates -->
  <g stroke="#00f0ff" stroke-width="2.5" opacity="0.75">
    <line x1="150" y1="58" x2="150" y2="80"/>
    <line x1="150" y1="242" x2="150" y2="220"/>
    <line x1="58" y1="150" x2="80" y2="150"/>
    <line x1="242" y1="150" x2="220" y2="150"/>
    <line x1="85" y1="85" x2="101" y2="101"/>
    <line x1="215" y1="85" x2="199" y2="101"/>
    <line x1="85" y1="215" x2="101" y2="199"/>
    <line x1="215" y1="215" x2="199" y2="199"/>
  </g>

  <!-- Inner Housing Core -->
  <circle cx="150" cy="150" r="64" fill="#071329" stroke="#00f0ff" stroke-width="3" filter="url(#coreGlow)"/>
  <circle cx="150" cy="150" r="50" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Luminous Heart -->
  <circle cx="150" cy="150" r="32" fill="#00f0ff" opacity="0.4" filter="url(#coreGlow)"/>
  <circle cx="150" cy="150" r="22" fill="#ffffff" filter="url(#coreGlow)"/>

  <!-- Interlocking Tri-Core Geometry -->
  <polygon points="150,126 171,162 129,162" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <polygon points="150,174 129,138 171,138" fill="none" stroke="#a855f7" stroke-width="2"/>
</svg>

